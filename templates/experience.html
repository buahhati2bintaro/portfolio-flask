{% extends "base.html" %}
{% block title %}Experience - Portofolio{% endblock %}
{% block content %}
<section class="experience-section">
    <h2 style="text-align: center; margin-bottom: 0.5rem;">Pengalaman & Pendidikan</h2>
    <p style="text-align: center; color: #ffffff; margin-bottom: 2rem;">
        Perjalanan karir dan latar belakang pendidikan saya:
    </p>

    <div class="timeline">
        {% for exp in experiences %}
        <div class="timeline-item">
            <div class="timeline-dot"></div>
            <div class="timeline-date">{{ exp.year }}</div>
            <div class="timeline-content">
                <h3>{{ exp.title }}</h3>
                <p>{{ exp.desc }}</p>
            </div>
        </div>
        {% endfor %}
    </div>
</section>
{% endblock %}
